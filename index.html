<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Connecting NetSuite</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 34rem; margin: 4rem auto; padding: 0 1rem; color: #1d2433; }
  code { background: #eef1f6; padding: 0 .25rem; border-radius: 3px; }
</style>
</head>
<body>
<h1>Connecting NetSuite</h1>
<p id="msg">Sending you back to yoraito-sync on this computer...</p>
<script>
// Static relay for NetSuite logins. NetSuite only redirects to https:// addresses (or a
// custom URL scheme), never to http://127.0.0.1, so the integration record registers this
// page as its redirect URI. The page holds no secrets and calls no server: it reads
// NetSuite's reply and forwards it, unchanged, to the daemon on 127.0.0.1. The port comes
// from the state the daemon created (v1.<nonce>.<port>). Nothing else is ever a
// destination, so the page cannot be used as an open redirect. The login uses PKCE, so a
// code that leaks from here is useless without the verifier, which stays in the daemon.
(function () {
  var params = new URLSearchParams(window.location.search);
  var parts = (params.get("state") || "").split(".");
  var port = Number(parts[2]);
  var msg = document.getElementById("msg");
  if (parts[0] !== "v1" || !parts[1] || !/^[0-9]+$/.test(parts[2] || "") || port < 1024 || port > 65535) {
    msg.textContent = "This link did not come from yoraito-sync. Start the connection again from the app.";
    return;
  }
  var forward = new URLSearchParams();
  ["code", "state", "company", "error"].forEach(function (k) {
    if (params.has(k)) forward.set(k, params.get(k));
  });
  // Replace this page's history entry so the code is not left in the back button.
  window.location.replace("http://127.0.0.1:" + port + "/oauth/netsuite/callback?" + forward.toString());
})();
</script>
<noscript><p>Turn on JavaScript, or copy this page's address and replace everything before <code>?</code> with <code>http://127.0.0.1:8765/oauth/netsuite/callback</code>.</p></noscript>
</body>
</html>
